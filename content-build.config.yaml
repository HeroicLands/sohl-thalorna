# This repository's content-build configuration.
#
# Every field, and which values are derived rather than authored, is documented
# in `@heroiclands/content-build`'s README. Comments here are limited to what
# that cannot tell you: the things about *this* repository that would otherwise
# read as accidents.

contentPackage: thalorna
packageKind: modules

# ⚠️ Stale, knowingly. These were moved verbatim out of the retired manifest
# template so that change was provably one of mechanism and not of output —
# stale values and all. The system this module targets is well past the range
# declared under `relationships`, and Foundry has moved on from `14`. What this
# module should actually claim is an open question, not a settled one.
compatibility:
    minimum: "14"
    verified: "14.364"

relationships:
    systems:
        - id: sohl
          type: system
          manifest: https://github.com/HeroicLands/Song-of-Heroic-Lands-FoundryVTT/releases/latest/download/system.json
          compatibility:
              minimum: "0.4.0"
              verified: "0.4.3"

stats:
    systemId: sohl
    lastModifiedBy: sohlbuilder00000

itemBuilders: sohl

# `actors` is deliberately absent. A Thalorna being is authored as nested items
# addressed by shortcode (`attribute:str`, `skill:awar`), and almost all of
# those belong to the **`sohl` package**, which this repository does not hold.
# Turning it on needs that package's compiled items available as a build-time
# catalog; at that point re-enabling it is this list and nothing else
# (#6, #1441).
packs:
    - { name: items, label: Items, type: Item, folders: item-folders.yaml }
    - {
          name: journals,
          label: Journals,
          type: JournalEntry,
          folders: journal-folders.yaml,
      }

publish:
    site: true
    manifests: { publish: true, consume: true }
    # This repository's existing address scheme written down, not a change to
    # it: the content tree mounts at the package root, and a `doc` note whose
    # `category` is `collection` addresses the section it introduces rather than
    # taking a slug of its own.
    address:
        prefix: ""
        landing: collection

packageBuild:
    # The compendium packs are **not** listed here: `build:compiledb` compiles
    # them into `build/stage/packs` directly from `assets/content`.
    assets:
        # Copied rather than bundled — it imports nothing, so there is nothing
        # for a bundler to resolve. The browser loads it from `esmodules`.
        - { from: src/sohl-thalorna.mjs, to: sohl-thalorna.mjs }
        - { from: lang, to: lang }
        # Loaded whenever the module is active — including under another system,
        # where SoHL's stylesheet is absent and this is the only thing marking
        # an unresolved link.
        - { from: styles, to: styles }
        - { from: README.md, to: README.md }
        # The dual license: the explainer, plus the full text of each half at
        # the paths the explainer points at.
        - { from: LICENSE.md, to: LICENSE.md }
        - { from: src/LICENSE, to: src/LICENSE }
        - { from: assets/LICENSE, to: assets/LICENSE }

    manifest:
        title: Thalorna Setting
        description: Items, Actors, Journals, Scenes, and other assets to enable play in the Thalorna setting for Song of Heroic Lands
        authors:
            - name: Toasty
              discord: toasty#8538
              flags: {}
        license: LICENSE.md
        readme: README.md
        changelog: CHANGELOG.md
        flags:
            allowBugReporter: true
        languages:
            - lang: en
              name: English
              path: lang/en.json
        esmodules:
            - sohl-thalorna.mjs
        styles:
            - src: styles/sohl-thalorna.css
              layer: sohl-thalorna
        packFolders:
            - name: Thalorna
              sorting: m
              color: "#008000"
              packs:
                  - items
                  - journals
        # Points into the **system's** asset paths, so these resolve only where
        # SoHL is installed.
        media:
            - type: setup
              url: systems/sohl/assets/ui/sohl-setup.webp
              thumbnail: systems/sohl/assets/ui/sohl-setup-thumb.webp
            - type: logo
              url: systems/sohl/assets/ui/sohl-logo.webp
            - type: icon
              url: systems/sohl/assets/ui/sohl-icon.webp
            - type: banner
              url: systems/sohl/assets/ui/sohl-banner.webp
        socket: true

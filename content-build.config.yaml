# See `@heroiclands/content-build` for the full documentation.

contentPackage: thalorna
packageKind: modules

compatibility:
    minimum: "14.359"
    verified: "14.364"

relationships:
    systems:
        - id: sohl
          type: system
          manifest: https://github.com/HeroicLands/Song-of-Heroic-Lands-FoundryVTT/releases/latest/download/system.json
          compatibility:
              minimum: "0.8.2"
              verified: "0.8.2"

stats:
    systemId: sohl
    lastModifiedBy: sohlbuilder00000

itemBuilders: sohl

# `actors` is deliberately absent, but no longer permanently so. A Thalorna
# being is authored as nested items addressed by shortcode (`attribute:str`,
# `skill:awar`), and almost all of those belong to the **`sohl` package**, which
# this repository does not hold — so the pass has nothing to resolve against and
# every embedded item fails.
#
# content-build#82 builds the way out: a declared relationship opting in with
# `itemCatalog: true` has its release fetched and its Item packs extracted, and
# the actors pass resolves against those exactly as it does a local pack. Once
# that ships, re-enabling this is one pack entry plus that one flag, and nothing
# else (#6, #1441). Order will be load-bearing when it returns — the actors pass
# reads the items pass's output, so items must compile first.
packs:
    - { name: items, label: Items, type: Item, folders: item-folders.yaml }
    - {
          name: journals,
          label: Journals,
          type: JournalEntry,
          folders: journal-folders.yaml,
      }

publish:
    site: true
    manifests: { publish: true, consume: true }
    address:
        prefix: ""
        landing: collection

packageBuild:
    assets:
        - { from: src/sohl-thalorna.mjs, to: sohl-thalorna.mjs }
        - { from: lang, to: lang }
        - { from: styles, to: styles }
        - { from: README.md, to: README.md }
        - { from: LICENSE.md, to: LICENSE.md }
        - { from: src/LICENSE, to: src/LICENSE }
        - { from: assets/LICENSE, to: assets/LICENSE }

    manifest:
        title: Thalorna Setting
        description: Items, Actors, Journals, Scenes, and other assets to enable play in the Thalorna setting for Song of Heroic Lands
        authors:
            - name: Toasty
              discord: toasty#8538
              flags: {}
        license: LICENSE.md
        readme: README.md
        changelog: CHANGELOG.md
        flags:
            allowBugReporter: true
        languages:
            - lang: en
              name: English
              path: lang/en.json
        esmodules:
            - sohl-thalorna.mjs
        styles:
            - src: styles/sohl-thalorna.css
              layer: sohl-thalorna
        packFolders:
            - name: Thalorna
              sorting: m
              color: "#008000"
              packs:
                  - items
                  - journals
        media:
            - type: setup
              url: systems/sohl/assets/ui/sohl-setup.webp
              thumbnail: systems/sohl/assets/ui/sohl-setup-thumb.webp
            - type: logo
              url: systems/sohl/assets/ui/sohl-logo.webp
            - type: icon
              url: systems/sohl/assets/ui/sohl-icon.webp
            - type: banner
              url: systems/sohl/assets/ui/sohl-banner.webp
        socket: true

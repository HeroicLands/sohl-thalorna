# See `@heroiclands/package-build` for the full documentation.

contentPackage: thalorna
packageKind: modules

compatibility:
    minimum: "14.359"
    verified: "14.364"

relationships:
    systems:
        - id: sohl
          type: system
          manifest: https://github.com/HeroicLands/Song-of-Heroic-Lands-FoundryVTT/releases/latest/download/system.json
          compatibility:
              minimum: "0.8.2"
              verified: "0.8.2"
          # Its Item packs are this repository's item catalogue. A Thalorna
          # being is nested items addressed by shortcode, and almost all of
          # those belong to sohl; `content-build deps fetch` caches them, keyed
          # by the `verified` version above so a build names one artifact.
          itemCatalog: true

stats:
    lastModifiedBy: sohlbuilder00000

itemBuilders: sohl

# The dependency between the passes is real and the order here is not what
# enforces it: the actors pass resolves each being's embedded items against the
# items pass's output, and package-build derives the compile order from what
# each pass reads, so items compile first whatever order this list declares
# (package-build#73). The list is free to be ordered for a reader, because it
# is also the manifest's `packs` array and the thing `packFolders` below names.
#
# What the actors pass cannot find locally comes from sohl's item catalogue,
# declared above (#6, #1441). Run `content-build deps fetch` before compiling;
# a cold cache fails saying so.
#
# This pass does not pass yet, deliberately. See the PR enabling it: sohl 0.8.2
# is the newest release, and roughly a hundred addresses these beings name exist
# only in sohl's unreleased main. Bumping `verified` once 0.9.0 is cut clears
# them; what is left after that is authoring debt in this repository.
packs:
    - { name: items, label: Items, type: Item, folders: item-folders.yaml }
    - { name: journals, label: Journals, type: JournalEntry, folders: journal-folders.yaml }
    - { name: actors, label: Actors, type: Actor, folders: actor-folders.yaml }

publish:
    # `content`: this package publishes its homepage *and* every page its
    # content tree compiles to. The other mode, `homepage`, fences the content
    # surfaces off entirely — it is what `sohl-kethira-basic` and
    # `harn-adventures` publish under, where shipping a content page would
    # breach the terms the material is licensed on.
    site: content
    manifests: { publish: true, consume: true }
    # Where the content tree mounts inside the package, read by both `manifest`
    # and the site build so the address a manifest publishes is the address a
    # page is emitted at. This package's content *is* its site, so it mounts at
    # the package root and the prefix is empty.
    address:
        prefix: ""

# How this repository frames the website it publishes. Framing only — how a page
# gets its *address* is `publish.address` above, shared with the link manifest
# so the two cannot disagree about where a page is.
#
# `content-build site` is the whole of the emitter (#85). This repository used
# to carry its own — a 907-line copy of `engine/site-build.mjs` plus a 281-line
# copy of `engine/web-wikilinks.mjs` — and that copy missed four upstream fixes
# in as many months, one of which emitted a zero-page site and one of which
# silently stripped every `uuid` from the published link manifest. There is no
# local site code left, and no seam for any: a gap here is fixed in
# `@heroiclands/package-build`, where every package gets the fix.
site:
    # Hugo's `contentDir`, and the mount as well: `publish.address.prefix` is
    # empty, so a page publishes at `/thalorna/<type>-<shortcode>/` and its file
    # is written flat at the root of this directory. The whole tree is wiped and
    # rewritten on every run, so it is a build artifact and never committed.
    out: site/content
    # `base` is absent, which means `/<contentPackage>/` — `/thalorna/`, the
    # path `site/hugo.toml`'s `baseURL` serves. The two are stated separately
    # because the site build addresses pages and Hugo renders them; keep them in
    # step when the site moves.
    #
    # `packages:` is absent too, and absent means `[contentPackage]`. `package:`
    # is retired, so every note in this tree is `thalorna` by construction and
    # naming a second package would select nothing.
    #
    # No `trees:` — this repository publishes no documentation tree beside its
    # content — and no `pass:`, which is a named bundle of a repository's own
    # body rewrites and this one has none.
    #
    # `backfillSections` is off. It writes a bare landing for every directory
    # under the mount, and with pages emitted flat the only directories are the
    # ones declared below, which already state their own titles.
    #
    # Every section this package publishes, so `/thalorna/<section>/` answers
    # with a titled page rather than a directory listing. Since #204 this is the
    # only place a section exists: a page is addressed `(type, shortcode)` and
    # written flat, so nothing else creates the directory. The list is also what
    # the package landing's card grid is built from — `assets/content/homepage.md`
    # declares `cards.source: sections`, which reads the site's own top-level
    # sections — so a section missing here is a card missing there.
    sections:
        affiliation: { title: Affiliations }
        being: { title: Beings }
        concoctiongear: { title: Concoctions }
        lore: { title: Lore }
        mystery: { title: Mysteries }
        mysticalability: { title: Mystical Abilities }
        place: { title: Places }
        reference: { title: Reference }
        scenario: { title: Scenarios }
        skill: { title: Skills }
        weapongear: { title: Weapons }

packageBuild:
    assets:
        - { from: src/sohl-thalorna.mjs, to: sohl-thalorna.mjs }
        - { from: lang, to: lang }
        - { from: styles, to: styles }
        - { from: README.md, to: README.md }
        - { from: LICENSE.md, to: LICENSE.md }
        - { from: src/LICENSE, to: src/LICENSE }
        - { from: assets/LICENSE, to: assets/LICENSE }

    manifest:
        title: Thalorna Setting
        description: Items, Actors, Journals, Scenes, and other assets to enable play in the Thalorna setting for Song of Heroic Lands
        authors:
            - name: Toasty
              discord: toasty#8538
              flags: {}
        license: LICENSE.md
        readme: README.md
        changelog: CHANGELOG.md
        flags:
            allowBugReporter: true
        languages:
            - lang: en
              name: English
              path: lang/en.json
        esmodules:
            - sohl-thalorna.mjs
        styles:
            - src: styles/sohl-thalorna.css
              layer: sohl-thalorna
        # Names every pack this package ships, so everything Thalorna adds
        # appears together in the compendium sidebar under one folder. It was
        # written when the build compiled two packs and described itself as
        # naming "only the packs this build compiles"; #69 turned the actors
        # pack on without extending it, and nothing reported the divergence
        # until package-build#81 began comparing the two (#95). Adding a pack
        # to `packs:` above means adding it here.
        packFolders:
            - name: Thalorna
              sorting: m
              color: "#008000"
              packs:
                  - items
                  - journals
                  - actors
        media:
            - type: setup
              url: systems/sohl/assets/ui/sohl-setup.webp
              thumbnail: systems/sohl/assets/ui/sohl-setup-thumb.webp
            - type: logo
              url: systems/sohl/assets/ui/sohl-logo.webp
            - type: icon
              url: systems/sohl/assets/ui/sohl-icon.webp
            - type: banner
              url: systems/sohl/assets/ui/sohl-banner.webp
        socket: true

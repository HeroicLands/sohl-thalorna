# The World of Thalorna — this package's own website (#1451).
#
# This repository builds, renders and deploys everything under `/thalorna`.
# Nothing else writes to that prefix, and this site needs no other repository
# to publish: a checkout, the theme submodule, Node and Hugo are the whole of
# it.
#
# `baseURL` is where Hugo is told the site's address. The content build is told
# separately, by `package-build.config.yaml` — it addresses a page as
# `/<contentPackage>/<type>-<shortcode>/`, and `site.base` overrides that — so
# moving this site means pointing both at the new prefix. The build reads no
# Hugo configuration: `content-build site` is the whole emitter and this
# repository holds no site code of its own (#85).
baseURL = "https://www.heroiclands.org/thalorna/"
locale = "en-us"
title = "The World of Thalorna"

# The output is published *with* the prefix — `build/site/thalorna/` — and the
# deploy uploads `build/site`, whose root is the hosting project's origin. So
# the deployment is byte-for-byte what www serves: it can be checked at the
# project's own address before any routing points at it, and it leaves the
# routing layer a path-preserving pass-through rather than a rewriter
# (Song-of-Heroic-Lands-FoundryVTT#1468).
publishDir = "../build/site/thalorna"

# Brand chrome, layouts, palette, and the SoHL info-block partials come from
# the shared theme, so this site reads as one whole with www and the SoHL
# knowledgebase.
#
# It arrives through `npm ci`, not a git submodule (#24). Hugo looks for
# `<themesDir>/<theme>`, so the package's scope is the themes directory and its
# name is the theme name — nothing is copied and no module mounts are needed.
#
# `themesDir` is relative to the **Hugo root**, which is this directory, not the
# repository root; the lockfile that installed the theme is one level up.
themesDir = "../node_modules/@heroiclands"
theme = "hugo-theme"

# Generated by `npm run build:site-content` — `content-build site` — from
# `assets/content/`, which is the source of truth for every published surface
# this package has. Pages are written flat: a note is addressed
# `type-shortcode` and files at the root of this directory, and the only
# subdirectories are the sections `site.sections` declares.
contentDir = "content"

[params]
  description = "The World of Thalorna — realms, peoples, faiths, creatures, and the lore behind them."
  author = "Tom Rodriguez"

  # The theme carries layout, not addresses, so every site-specific URL it
  # renders is supplied here. See the theme's README for the full contract.
  cdnBaseURL = "https://cdn.heroiclands.org"

  [params.brand]
    logo       = "images/brand/sohl-icon-white.webp"
    licenseURL = "https://www.heroiclands.org/license/"
    discordURL = "https://discord.gg/EwMfkNd3az"

  # This is a setting, not a reference catalog: a reader browsing Thalorna has
  # no use for the internal identifier behind a name, so listings show plain
  # titles. The knowledgebase sets this and gets "Name (shortcode)".
  [params.list]
    shortcodes = false

  # No `params.home`. That block fed the theme's *featured grid*, the older of
  # the two shapes its `layouts/index.html` offers, and this site takes the
  # other one: the home page is the package landing, authored as
  # `assets/content/homepage.md` and rendered by the theme's
  # `layouts/partials/landing.html` (#91). The hero title, tagline and banner
  # that used to be written here are that note's `title`, `description` and
  # `banner`, because they are the page's, not the site's.

  # The "page not found" page. Its template is the theme's, since every
  # consumer needs one; the wording and the routes back are ours. A relative
  # `url` is resolved against this site's own base, so these survive a move.
  [params.notfound]
    heroimage = "images/banners/tapestry-of-dreams.webp"
    tagline   = "This world has no page at"
    sitenoun  = "world"

    [[params.notfound.links]]
      title = "The World of Thalorna"
      url   = "/"
      text  = "Every section of the setting, from the top."
    [[params.notfound.links]]
      title = "Realms and Regions"
      url   = "/polity/"
      text  = "The realms of Thalorna, their rulers, and the lands they hold."
    [[params.notfound.links]]
      title = "Characters"
      url   = "/character/"
      text  = "The people of the world — rulers, rivals, and the merely notorious."
    [[params.notfound.links]]
      title = "Creatures"
      url   = "/creature/"
      text  = "What lives out there, and what it does to those who meet it."

# The brand nav. Absolute URLs so this header matches the one every other site
# renders; defined here rather than in the shared theme, which carries no
# addresses of its own.
[menu]
  [[menu.main]]
    name = "Home"
    url = "https://www.heroiclands.org/"
    weight = 1
  [[menu.main]]
    name = "Song of Heroic Lands"
    url = "https://www.heroiclands.org/projects/song-of-heroic-lands/"
    weight = 2
    identifier = "sohl"
  [[menu.main]]
    name = "Knowledgebase"
    url = "https://kb.heroiclands.org/"
    weight = 1
    parent = "sohl"
  [[menu.main]]
    name = "API Documentation"
    url = "https://api.heroiclands.org/"
    weight = 2
    parent = "sohl"
  [[menu.main]]
    name = "Thalorna"
    url = "https://www.heroiclands.org/thalorna/world/thalorna/"
    weight = 3
  [[menu.main]]
    name = "HârnMaster 3"
    url = "https://www.heroiclands.org/projects/hm3/"

# Only `tags`. Hugo's defaults also include `categories`, which nothing here
# authors — leaving it on publishes an empty /categories/ index.
[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"

# Section pages (_index.md) render to HTML: every section this site publishes
# has a landing, written from `site.sections` in `package-build.config.yaml`.
[outputs]
  home = ["HTML"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]
